<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>큐폴라 채널 대시보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; padding: 1.5rem; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
  .yt-icon { color: #E24B4A; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 200px; font-size: 13px; padding: 7px 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
  .toolbar input:focus { border-color: #888; }
  button { font-size: 13px; padding: 7px 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; white-space: nowrap; }
  button:hover { background: #f0f0f0; }
  .last-updated { font-size: 12px; color: #888; margin-bottom: 1rem; }
  .channel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 1rem; }
  .channel-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1rem 1.25rem; }
  .channel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .channel-thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #eee; }
  .channel-name { font-size: 14px; font-weight: 600; }
  .channel-handle { font-size: 12px; color: #888; }
  .remove-btn { margin-left: auto; font-size: 12px; color: #E24B4A; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .remove-btn:hover { background: #fef2f2; }
  .channel-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat-box { background: #f8f8f8; border-radius: 8px; padding: 8px 10px; }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 2px; }
  .stat-value { font-size: 15px; font-weight: 600; }
  .videos-label { font-size: 12px; color: #555; font-weight: 600; margin-bottom: 8px; }
  .video-list { display: flex; flex-direction: column; gap: 6px; }
  .video-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 1px solid #f0f0f0; }
  .video-item.highlight { border-color: #fde68a; background: #fffbeb; }
  .video-thumb { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; background: #eee; flex-shrink: 0; }
  .video-info { flex: 1; min-width: 0; }
  .video-title { font-size: 12px; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .video-meta { font-size: 11px; color: #888; margin-top: 2px; }
  .video-link { font-size: 11px; color: #1a73e8; text-decoration: none; margin-left: auto; flex-shrink: 0; }
  .perf-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 5px; vertical-align: middle; }
  .perf-hot { background: #fef3c7; color: #92400e; }
  .perf-top { background: #dcfce7; color: #166534; }
  .avg-note { font-size: 11px; color: #aaa; margin-bottom: 8px; }
  .video-list-wrap { position: relative; }
  .video-list-inner { display: flex; flex-direction: column; gap: 6px; }
  .video-list-inner.collapsed .video-item:nth-child(n+6) { display: none; }
  .more-btn { margin-top: 8px; width: 100%; font-size: 12px; padding: 6px; border: 1px solid #e5e5e5; border-radius: 8px; background: #f8f8f8; cursor: pointer; color: #555; }
  .more-btn:hover { background: #f0f0f0; }
  .msg { font-size: 12px; color: #888; padding: 8px; }
  .error { font-size: 12px; color: #E24B4A; padding: 8px; }
</style>
</head>
<body>

<h1><span class="yt-icon">▶</span> 큐폴라 채널 대시보드</h1>

<div class="toolbar">
  <input type="text" id="add-input" placeholder="채널 URL 또는 @핸들 입력" />
  <button onclick="addChannel()">+ 추가</button>
  <button onclick="refreshAll()">↻ 새로고침</button>
</div>

<div class="last-updated" id="last-updated">업데이트 중...</div>
<div class="channel-grid" id="channel-grid"></div>

<script>
const API_KEY = 'AIzaSyBv2ONl3ancN96nOWOnoPBo2tw_WNFg3QU';

let channels = [];

function fmt(n) {
  return (parseInt(n) || 0).toLocaleString('ko-KR');
}

function fmtShort(n) {
  n = parseInt(n) || 0;
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 10000) return Math.round(n/1000) + 'K';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toLocaleString('ko-KR');
}

function fmtDate(d) {
  const dt = new Date(d);
  const Y = dt.getFullYear();
  const M = String(dt.getMonth()+1).padStart(2,'0');
  const D = String(dt.getDate()).padStart(2,'0');
  const h = String(dt.getHours()).padStart(2,'0');
  const m = String(dt.getMinutes()).padStart(2,'0');
  return `${Y}.${M}.${D} ${h}:${m}`;
}

function cleanHandle(val) {
  return val.replace(/^https?:\/\/(www\.)?youtube\.com\/@?/, '').replace(/^@/, '');
}

async function resolveChannel(handle) {
  const clean = cleanHandle(handle);
  const r = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=id,snippet,statistics,contentDetails&forHandle=${clean}&key=${API_KEY}`);
  const d = await r.json();
  return d.items?.[0] || null;
}

async function getVideos(channelId, uploadsPlaylistId) {
  const r = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsPlaylistId}&maxResults=20&key=${API_KEY}`);
  const d = await r.json();
  if (!d.items?.length) return { recent: [], avgViews: 0, total: 0 };
  const ids = d.items.map(i => i.snippet.resourceId.videoId).join(',');
  const r2 = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics,snippet&id=${ids}&key=${API_KEY}`);
  const d2 = await r2.json();
  const all = d2.items || [];
  const avgViews = all.length
    ? Math.round(all.reduce((s, v) => s + (parseInt(v.statistics.viewCount) || 0), 0) / all.length)
    : 0;
  return { recent: all, avgViews, total: all.length };
}

function perfBadge(views, avg) {
  if (!avg) return '';
  const ratio = views / avg;
  if (ratio >= 2) return '<span class="perf-badge perf-top">▲ TOP</span>';
  if (ratio >= 1.3) return '<span class="perf-badge perf-hot">🔥 +' + Math.round((ratio-1)*100) + '%</span>';
  return '';
}

function getOrCreateCard(idx) {
  let card = document.getElementById('card-' + idx);
  if (!card) {
    card = document.createElement('div');
    card.id = 'card-' + idx;
    card.className = 'channel-card';
    document.getElementById('channel-grid').appendChild(card);
  }
  return card;
}

async function loadChannel(idx) {
  const ch = channels[idx];
  const card = getOrCreateCard(idx);
  card.innerHTML = `<div class="msg">불러오는 중... ${ch.handle}</div>`;
  try {
    const data = await resolveChannel(ch.handle);
    if (!data) { card.innerHTML = `<div class="error">채널을 찾을 수 없습니다: ${ch.handle}</div>`; return; }
    const uploadsId = data.contentDetails?.relatedPlaylists?.uploads || '';
    const { recent, avgViews, total } = await getVideos(data.id, uploadsId);
    const s = data.statistics;
    const sn = data.snippet;
    const thumb = sn.thumbnails?.default?.url || '';
    const videoHTML = recent.map(v => {
      const vt = v.snippet;
      const vs = v.statistics;
      const vthumb = vt.thumbnails?.medium?.url || vt.thumbnails?.default?.url || '';
      const views = parseInt(vs.viewCount) || 0;
      const badge = perfBadge(views, avgViews);
      const isHot = badge.includes('perf-hot') || badge.includes('perf-top');
      return `<div class="video-item${isHot ? ' highlight' : ''}">
        <img class="video-thumb" src="${vthumb}" alt="" />
        <div class="video-info">
          <div class="video-title">${vt.title}${badge}</div>
          <div class="video-meta">조회 ${fmt(vs.viewCount)} · 좋아요 ${fmt(vs.likeCount)} · 댓글 ${fmt(vs.commentCount)} · ${fmtDate(vt.publishedAt)}</div>
        </div>
        <a class="video-link" href="https://youtu.be/${v.id}" target="_blank">▶</a>
      </div>`;
    }).join('');
    card.innerHTML = `
      <div class="channel-header">
        <img class="channel-thumb" src="${thumb}" alt="${sn.title}" />
        <div>
          <div class="channel-name">${sn.title}</div>
          <div class="channel-handle">${ch.handle}</div>
        </div>
        <button class="remove-btn" onclick="removeChannel(${idx})">✕ 삭제</button>
      </div>
      <div class="channel-stats">
        <div class="stat-box"><div class="stat-label">구독자</div><div class="stat-value">${fmt(s.subscriberCount)}</div></div>
        <div class="stat-box"><div class="stat-label">총 조회수</div><div class="stat-value">${fmt(s.viewCount)}</div></div>
        <div class="stat-box"><div class="stat-label">영상 수</div><div class="stat-value">${fmt(s.videoCount)}</div></div>
      </div>
      <div class="videos-label">최근 영상 (최근 ${total}개 기준 · 평균 조회수 ${fmt(avgViews)})</div>
      <div class="avg-note">평균 +30% 이상 🔥, +100% 이상 ▲ TOP</div>
      <div class="video-list-wrap">
        <div class="video-list-inner collapsed" id="vlist-${idx}">${videoHTML || '<div class="msg">영상 없음</div>'}</div>
        ${recent.length > 5 ? `<button class="more-btn" onclick="toggleVideos(${idx}, this)">▼ 더보기 (${recent.length - 5}개)</button>` : ''}
      </div>
    `;
  } catch(e) {
    card.innerHTML = `<div class="error">오류: ${e.message}</div>`;
  }
}

function toggleVideos(idx, btn) {
  const list = document.getElementById('vlist-' + idx);
  const collapsed = list.classList.toggle('collapsed');
  const total = list.querySelectorAll('.video-item').length;
  btn.textContent = collapsed ? `▼ 더보기 (${total - 5}개)` : '▲ 접기';
}

async function saveChannels() {
  await fetch('/api/channels', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(channels),
  });
}

async function removeChannel(idx) {
  channels.splice(idx, 1);
  await saveChannels();
  document.getElementById('channel-grid').innerHTML = '';
  channels.forEach((_, i) => loadChannel(i));
}

async function addChannel() {
  const input = document.getElementById('add-input');
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  const handle = val.startsWith('http') ? val : '@' + val.replace(/^@/, '');
  channels.push({ handle });
  await saveChannels();
  loadChannel(channels.length - 1);
}

async function refreshAll() {
  document.getElementById('last-updated').textContent = '업데이트 중...';
  document.getElementById('channel-grid').innerHTML = '';
  channels = await fetch('/api/channels').then(r => r.json());
  await Promise.all(channels.map((_, i) => loadChannel(i)));
  document.getElementById('last-updated').textContent = '마지막 업데이트: ' + new Date().toLocaleTimeString('ko-KR');
}

refreshAll();
</script>
</body>
</html>
