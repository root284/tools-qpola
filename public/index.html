<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tools.qpola.net</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦄</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #08080f;
    color: #e8e8f0;
    min-height: 100vh;
    /* grid background */
    background-image:
      linear-gradient(rgba(120,80,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,80,255,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* ambient glow blobs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    background: rgba(108, 40, 255, 0.12);
    top: -200px; left: -150px;
  }
  body::after {
    width: 500px; height: 500px;
    background: rgba(0, 200, 220, 0.08);
    bottom: -150px; right: -100px;
  }

  header {
    position: relative; z-index: 10;
    background: rgba(12,12,20,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 1rem 2rem;
    display: flex; align-items: center;
  }
  .logo {
    font-size: 15px; font-weight: 700;
    text-decoration: none;
    background: linear-gradient(90deg, #a78bfa, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.01em;
  }

  main { position: relative; z-index: 1; max-width: 980px; margin: 3rem auto; padding: 0 1.5rem; }

  .hero { margin-bottom: 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; }
  .hero h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #fff 40%, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* add bar */
  .add-bar { display: flex; gap: 8px; align-items: center; min-width: 300px; }
  .add-bar input {
    flex: 1; font-size: 13px; padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; outline: none; min-width: 0;
    background: rgba(255,255,255,0.05); color: #e8e8f0;
  }
  .add-bar input::placeholder { color: rgba(255,255,255,0.25); }
  .add-bar input:focus { border-color: rgba(167,139,250,0.5); background: rgba(255,255,255,0.07); }
  .add-bar button {
    font-size: 13px; padding: 8px 14px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; background: rgba(255,255,255,0.05);
    color: #ccc; cursor: pointer; white-space: nowrap;
  }
  .add-bar button:hover { background: rgba(255,255,255,0.1); }
  .add-bar button.primary {
    background: linear-gradient(135deg, #7c3aed, #0891b2);
    border: none; color: #fff; font-weight: 600;
  }
  .add-bar button.primary:hover { opacity: 0.88; }

  /* preview card */
  .preview-wrap { margin-bottom: 1.5rem; display: none; }
  .preview-card {
    background: rgba(167,139,250,0.07);
    border: 1px solid rgba(167,139,250,0.25);
    border-radius: 14px; padding: 1rem 1.25rem;
    display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;
  }
  .preview-icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
  .preview-favicon { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: #222; }
  .p-emoji-preview { width: 36px; height: 36px; font-size: 26px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: rgba(255,255,255,0.08); }
  .p-emoji-input { width: 44px; font-size: 20px; text-align: center; border: 1px solid rgba(167,139,250,0.3); border-radius: 6px; padding: 2px; background: rgba(167,139,250,0.1); outline: none; cursor: text; color: #e8e8f0; }
  .p-emoji-hint { font-size: 10px; color: rgba(255,255,255,0.3); text-align: center; }
  .preview-info { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 5px; }
  .preview-info input {
    font-size: 13px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
    padding: 6px 9px; outline: none; background: rgba(255,255,255,0.05); color: #e8e8f0; width: 100%;
  }
  .preview-info input::placeholder { color: rgba(255,255,255,0.2); }
  .preview-info input:focus { border-color: rgba(167,139,250,0.5); }
  .p-tag-input { font-size: 12px !important; }
  .preview-actions { display: flex; gap: 6px; flex-shrink: 0; align-self: center; }
  .preview-actions button {
    font-size: 12px; padding: 6px 14px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer;
  }
  .preview-actions button:hover { background: rgba(255,255,255,0.1); }
  .preview-actions button.confirm {
    background: linear-gradient(135deg, #7c3aed, #0891b2);
    border: none; color: #fff; font-weight: 600;
  }
  .preview-actions button.confirm:hover { opacity: 0.88; }

  /* grid */
  .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }

  .tool-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(124,58,237,0.2);
    border-radius: 14px; padding: 1.25rem;
    text-decoration: none; color: inherit; display: block;
    position: relative;
    box-shadow: 0 0 16px rgba(124,58,237,0.08), 0 0 1px rgba(167,139,250,0.15);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .tool-card::before {
    content: '';
    position: absolute; inset: 0; border-radius: 14px;
    background: linear-gradient(135deg, rgba(124,58,237,0.06), rgba(8,145,178,0.06));
    opacity: 1; pointer-events: none;
  }
  .tool-card:hover {
    border-color: rgba(167,139,250,0.45);
    box-shadow: 0 0 24px rgba(124,58,237,0.18), 0 0 48px rgba(8,145,178,0.08), 0 0 1px rgba(167,139,250,0.3);
    background: rgba(255,255,255,0.05);
  }
  .tool-card.sortable-ghost { opacity: 0.2; }
  .tool-card.sortable-drag { box-shadow: 0 0 0 1px rgba(167,139,250,0.4), 0 16px 48px rgba(108,40,255,0.3); }

  .drag-handle { position: absolute; bottom: 10px; right: 10px; cursor: grab; color: rgba(255,255,255,0.15); font-size: 15px; user-select: none; }
  .drag-handle:hover { color: rgba(255,255,255,0.4); }
  .drag-handle:active { cursor: grabbing; }

  .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  .tool-card:hover .card-actions { opacity: 1; }
  .card-remove { font-size: 11px; color: #f87171; background: rgba(248,113,113,0.1); border: none; border-radius: 5px; padding: 2px 7px; cursor: pointer; }
  .card-edit { font-size: 11px; color: #a78bfa; background: rgba(167,139,250,0.1); border: none; border-radius: 5px; padding: 2px 7px; cursor: pointer; }

  .tool-icon { font-size: 28px; margin-bottom: 14px; }
  .tool-favicon { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; background: #222; margin-bottom: 14px; display: block; }
  .tool-name { font-size: 15px; font-weight: 600; margin-bottom: 5px; color: #f0f0fa; }
  .tool-desc { font-size: 13px; color: rgba(255,255,255,0.4); line-height: 1.55; }
  .tool-tag {
    display: inline-block; margin-top: 12px; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 4px;
    background: rgba(167,139,250,0.12); color: #a78bfa;
    border: 1px solid rgba(167,139,250,0.2);
  }

  .status-msg { font-size: 13px; color: rgba(255,255,255,0.35); padding: 4px 0; }
  footer { position: relative; z-index: 1; text-align: center; padding: 3rem 1rem; font-size: 12px; color: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<header>
  <a class="logo" href="/">▶ tools.qpola.net</a>
</header>

<main>
  <div class="hero">
    <h1>큐폴라 AI 도구 모음</h1>
    <div>
      <div class="add-bar">
        <input type="text" id="url-input" placeholder="URL 입력 후 추가" />
        <button class="primary" onclick="fetchMeta()">+ 추가</button>
      </div>
      <div id="status-msg" class="status-msg" style="margin-top:6px;min-height:18px;"></div>
    </div>
  </div>

  <div class="preview-wrap" id="preview-wrap">
    <div class="preview-card">
      <div class="preview-icon-wrap">
        <img class="preview-favicon" id="p-favicon" src="" alt="" onerror="this.style.visibility='hidden'" />
        <div class="p-emoji-preview" id="p-emoji-preview" style="display:none"></div>
        <input class="p-emoji-input" id="p-emoji" type="text" placeholder="이모지 입력" maxlength="2" title="이모지로 대체 (선택)" oninput="onEmojiInput(this.value)" />
        <span class="p-emoji-hint">파비콘 대체</span>
      </div>
      <div class="preview-info">
        <input id="p-title" type="text" placeholder="도구 이름" />
        <input id="p-desc" type="text" placeholder="설명 (선택)" />
        <input id="p-tag" type="text" placeholder="태그 (선택, 예: YouTube, AI, Design)" class="p-tag-input" />
      </div>
      <div class="preview-actions">
        <button class="cancel" onclick="cancelPreview()">취소</button>
        <button class="confirm" onclick="confirmAdd()">추가</button>
      </div>
    </div>
  </div>

  <div class="tools-grid" id="tools-grid"></div>
</main>

<footer>© 2026 qpola.net</footer>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
const BUILTIN_DEFAULT = [
  {
    name: '채널 대시보드',
    desc: '유튜브 채널 구독자, 조회수, 최신 영상 퍼포먼스 모니터링.',
    icon: '📊',
    url: '/dashboard/',
    tag: 'YouTube',
    builtin: true,
  },
];

let pendingTool = null;
let editingIdx = null;
let allTools = [];

async function loadTools() {
  const res = await fetch('/api/tools');
  const saved = await res.json();
  if (!saved.length) {
    allTools = [...BUILTIN_DEFAULT];
    await saveTools();
  } else {
    allTools = saved;
  }
}

async function saveTools() {
  await fetch('/api/tools', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(allTools),
  });
}

function renderGrid() {
  const grid = document.getElementById('tools-grid');
  grid.innerHTML = allTools.map((t, i) => {
    const actions = !t.builtin ? `
      <div class="card-actions">
        <button class="card-edit" onclick="editTool(${i}, event)">✎</button>
        <button class="card-remove" onclick="removeTool(${i}, event)">✕</button>
      </div>` : '';
    const iconEl = t.icon
      ? `<div class="tool-icon">${t.icon}</div>`
      : t.favicon
        ? `<img class="tool-favicon" src="${t.favicon}" alt="" onerror="this.style.visibility='hidden'" />`
        : `<div class="tool-icon">🔗</div>`;
    return `
      <a class="tool-card" data-idx="${i}" href="${t.url}" ${t.url.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}>
        ${actions}
        ${iconEl}
        <div class="tool-name">${t.name}</div>
        <div class="tool-desc">${t.desc}</div>
        ${t.tag ? `<span class="tool-tag">${t.tag}</span>` : ''}
        <span class="drag-handle">⠿</span>
      </a>`;
  }).join('');
}

async function removeTool(idx, e) {
  e.preventDefault();
  e.stopPropagation();
  allTools.splice(idx, 1);
  await saveTools();
  renderGrid();
}

async function fetchMeta() {
  const input = document.getElementById('url-input');
  const url = input.value.trim();
  if (!url) return;
  setStatus('불러오는 중...');
  try {
    const res = await fetch('/api/meta?url=' + encodeURIComponent(url));
    const data = await res.json();
    if (data.error) { setStatus('오류: ' + data.error); return; }
    pendingTool = data;
    document.getElementById('p-favicon').src = data.favicon;
    document.getElementById('p-favicon').style.visibility = 'visible';
    document.getElementById('p-title').value = data.title || url;
    document.getElementById('p-desc').value = data.description || '';
    document.getElementById('p-emoji').value = '';
    document.getElementById('p-tag').value = '';
    document.getElementById('preview-wrap').style.display = 'block';
    document.getElementById('p-title').focus();
    setStatus('');
    input.value = '';
  } catch (e) {
    setStatus('오류: ' + e.message);
  }
}

function cancelPreview() {
  pendingTool = null;
  editingIdx = null;
  document.getElementById('preview-wrap').style.display = 'none';
  setStatus('');
}

function editTool(idx, e) {
  e.preventDefault();
  e.stopPropagation();
  const t = allTools[idx];
  editingIdx = idx;
  pendingTool = { url: t.url, favicon: t.favicon || '' };
  document.getElementById('p-favicon').src = t.favicon || '';
  document.getElementById('p-favicon').style.visibility = t.favicon ? 'visible' : 'hidden';
  document.getElementById('p-emoji').value = t.icon || '';
  document.getElementById('p-title').value = t.name || '';
  document.getElementById('p-desc').value = t.desc || '';
  document.getElementById('p-tag').value = t.tag || '';
  document.getElementById('preview-wrap').style.display = 'block';
  document.getElementById('p-title').focus();
}

async function confirmAdd() {
  if (!pendingTool) return;
  const emoji = document.getElementById('p-emoji').value.trim();
  const tool = {
    name: document.getElementById('p-title').value || pendingTool.url,
    desc: document.getElementById('p-desc').value || '',
    icon: emoji || null,
    favicon: emoji ? null : pendingTool.favicon,
    tag: document.getElementById('p-tag').value.trim() || null,
    url: pendingTool.url,
  };
  if (editingIdx !== null) {
    allTools[editingIdx] = tool;
  } else {
    allTools.push(tool);
  }
  await saveTools();
  cancelPreview();
  renderGrid();
}

function onEmojiInput(val) {
  const favicon = document.getElementById('p-favicon');
  const preview = document.getElementById('p-emoji-preview');
  if (val.trim()) {
    favicon.style.display = 'none';
    preview.style.display = 'flex';
    preview.textContent = val.trim();
  } else {
    favicon.style.display = '';
    preview.style.display = 'none';
  }
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

document.getElementById('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchMeta();
});

loadTools().then(() => {
  renderGrid();
  Sortable.create(document.getElementById('tools-grid'), {
    animation: 150,
    handle: '.drag-handle',
    ghostClass: 'sortable-ghost',
    dragClass: 'sortable-drag',
    onEnd: async () => {
      const cards = [...document.querySelectorAll('.tool-card')];
      allTools = cards.map(c => allTools[parseInt(c.dataset.idx)]);
      renderGrid();
      await saveTools();
    },
  });
});
</script>

</body>
</html>
